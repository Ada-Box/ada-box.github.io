<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ada 的法律资料主页</title>
  <style>
    body {
      font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 40px;
      color: #333;
    }
    h1 {
      color: #0055aa;
      font-size: 32px;
    }
    input[type="text"] {
      width: 100%;
      max-width: 500px;
      padding: 10px;
      font-size: 16px;
      margin: 20px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    ul {
      margin-top: 20px;
      padding-left: 20px;
    }
    li {
      margin: 18px 0;
      font-size: 18px;
    }
    a {
      color: #007acc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .keywords {
      font-size: 14px;
      color: #666;
      margin-left: 24px;
    }
  </style>
</head>
<body>
  <h1>Ada 的法律资料主页</h1>
  <p>以下资料均为 PDF 文件，点击链接可直接预览：</p>

  <!-- 搜索框 -->
  <input type="text" id="searchInput" placeholder="🔍 输入关键词筛选文档..." onkeyup="filterList()" />

  <!-- PDF 列表 -->
  <ul id="pdfList">
    <li>
      📄 <a href="Guide/index.pdf" target="_blank">
        微信、支付宝交易流水调取操作指引（律师版）
      </a>
      <div class="keywords">关键词：调查令 交易流水 实操指引</div>
    </li>
    <li>
      📄 <a href="Cases/index.pdf" target="_blank">
        （2021）最高法知民终2112号雄狮公司与新网公司计算机软件开发合同纠纷案
      </a>
      <div class="keywords">关键词：聊天记录 原始载体</div>
    </li>
    <!-- 你可以继续添加更多 PDF 文件条目 -->
  </ul>

  <!-- JavaScript 搜索功能 -->
  <script>
    function filterList() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const items = document.querySelectorAll("#pdfList li");
      items.forEach(item => {
        const text = item.innerText.toLowerCase();
        item.style.display = text.includes(input) ? "" : "none";
      });
    }
  </script>
</body>
</html>
