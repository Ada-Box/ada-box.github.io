<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ada 的法律资料主页</title>
  <style>
    body {
      font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 40px;
      color: #333;
    }
    h1 {
      color: #0055aa;
      font-size: 32px;
    }
    h2 {
      margin-top: 40px;
      font-size: 24px;
      color: #222;
      border-bottom: 2px solid #ddd;
      padding-bottom: 6px;
    }
    input[type="text"] {
      width: 100%;
      max-width: 500px;
      padding: 10px;
      font-size: 16px;
      margin: 20px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    ul {
      margin-top: 10px;
      padding-left: 20px;
    }
    li {
      margin: 18px 0;
      font-size: 18px;
    }
    a {
      color: #007acc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .keywords {
      font-size: 14px;
      color: #666;
      margin-left: 24px;
    }
    #noResults {
      display: none;
      color: #888;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Ada 的法律资料主页</h1>
  <p>以下资料仅供学习研究使用，点击链接可直接预览：</p>

  <!-- 搜索框 -->
  <input type="text" id="searchInput" placeholder="🔍 搜索标题或关键词..." onkeyup="filterList()" />

  <!-- 📁 实操指引 / 指南 -->
  <h2>📁 实操指引 / 指南</h2>
  <ul class="pdf-section">
    <li>
      📄 <a href="Guide/index.pdf" target="_blank">微信、支付宝交易流水调取操作指引（律师版）</a>
      <div class="keywords">关键词：调查令 交易流水 实操指引</div>
    </li>
  </ul>

  <!-- 📁 案例精选 -->
  <h2>📁 案例精选</h2>
  <ul class="pdf-section">
    <li>
      📄 <a href="Cases/index.pdf" target="_blank">（2021）最高法知民终2112号雄狮公司与新网公司计算机软件开发合同纠纷案</a>
      <div class="keywords">关键词：聊天记录 原始载体</div>
    </li>
  </ul>

   <!-- 📁 法律研究 -->
  <h2>📁 法律研究</h2>
  <ul class="pdf-section">
    <li>
      📄 <a href="Legal Research/index.mhtml" target="_blank">关于股东知情权的实务分析</a>
      <div class="keywords">关键词：股东知情权纠纷 案例 前置程序</div>
    </li>
  </ul>
  <div id="noResults">❗ 未找到匹配的文件，请尝试其他关键词。</div>

  <!-- JavaScript 搜索功能 -->
  <script>
    function filterList() {
      const input = document.getElementById("searchInput").value.toLowerCase();
      const sections = document.querySelectorAll(".pdf-section");
      let anyVisible = false;

      sections.forEach(section => {
        const items = section.querySelectorAll("li");
        let hasVisible = false;

        items.forEach(item => {
          const text = item.innerText.toLowerCase();
          const match = text.includes(input);
          item.style.display = match ? "" : "none";
          if (match) hasVisible = true;
        });

        section.style.display = hasVisible ? "" : "none";
        const prevHeading = section.previousElementSibling;
        if (prevHeading && prevHeading.tagName === "H2") {
          prevHeading.style.display = hasVisible ? "" : "none";
        }

        if (hasVisible) anyVisible = true;
      });

      document.getElementById("noResults").style.display = anyVisible ? "none" : "block";
    }
  </script>
</body>
</html>
