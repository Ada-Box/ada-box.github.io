<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ada 的法律资料主页</title>
  <style>
    body {
      font-family: "Helvetica Neue", "PingFang SC", "Microsoft YaHei", sans-serif;
      background-color: #f7f7f7;
      margin: 0;
      padding: 40px;
      color: #333;
    }
    h1 {
      color: #0055aa;
      font-size: 32px;
    }
    input[type="text"] {
      width: 100%;
      padding: 10px;
      margin: 20px 0;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    ul {
      padding-left: 20px;
    }
    li {
      margin: 12px 0;
      font-size: 18px;
    }
    a {
      color: #007acc;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>Ada 的法律资料主页</h1>
  <p>以下资料均为 PDF 文件，点击链接可直接预览：</p>

  <input type="text" id="searchInput" placeholder="🔍 输入关键词搜索标题..." />

  <ul id="pdfList">
    <li>
      📄 <a href="Guide/index.pdf" target="_blank">
        微信、支付宝交易流水调取操作指引（律师版）
      </a>
    </li>
    <li>
      📄 <a href="Cases/index.pdf" target="_blank">
        （2021）最高法知民终2112号雄狮公司与新网公司计算机软件开发合同纠纷案
      </a>
    </li>
    <!-- 可继续添加其他 PDF 条目 -->
  </ul>

  <script>
    const input = document.getElementById("searchInput");
    const list = document.getElementById("pdfList");

    input.addEventListener("input", function () {
      const filter = input.value.toLowerCase();
      const items = list.getElementsByTagName("li");

      for (let i = 0; i < items.length; i++) {
        const text = items[i].textContent.toLowerCase();
        items[i].style.display = text.includes(filter) ? "" : "none";
      }
    });
  </script>
</body>
</html>
